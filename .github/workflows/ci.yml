name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # There are no dependencies, so there is nothing to install.
      - name: Search engine tests
        run: npm test

      - name: Palette contrast audit
        run: npm run audit
