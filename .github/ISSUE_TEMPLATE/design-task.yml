name: Design task
description: A screen, component or visual question to work through in Claude Design.
title: "Design: "
labels: ["area:design"]
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs designing
      description: The screen, component or open question, and the one thing it must get right.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Real content to design with
      description: Use real lesson text and numbers, never placeholder copy.
  - type: dropdown
    id: paper
    attributes:
      label: Papers
      options:
        - Both blueprint and whiteprint
        - Whiteprint only
        - Blueprint only
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Done when
      options:
        - label: Shown at phone width (320–390px) and desktop
        - label: Text meets 4.5:1 and graphics 3:1 on the rendered paper
        - label: Meaning is never carried by colour alone
        - label: Focus, hover, pressed and disabled states are shown
        - label: The paper is never louder than the drawing
  - type: textarea
    id: links
    attributes:
      label: Links
      description: The Claude Design canvas or design-system link, and related issues.
