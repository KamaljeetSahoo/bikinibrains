name: Publish wiki

# The wiki is written in the repository's wiki/ folder, reviewed through pull
# requests like any other change, and mirrored to the GitHub wiki from here.
# Edits made directly in the wiki's web editor are overwritten on the next run.

on:
  push:
    branches: [master]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror wiki/ to the GitHub wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone --depth 1 "$remote" "$RUNNER_TEMP/wiki"; then
            echo "::error::The wiki has no pages yet, so GitHub hasn't created its repository. Open https://github.com/${GITHUB_REPOSITORY}/wiki, save any first page once, then re-run this workflow."
            exit 1
          fi
          rsync -a --delete --exclude ".git" wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches wiki/."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push
