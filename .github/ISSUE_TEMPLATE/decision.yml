name: Decision
description: A choice that needs to be made and recorded in the decision log.
title: "Decide: "
labels: ["decision", "needs-owner"]
type: Task
body:
  - type: textarea
    id: question
    attributes:
      label: The decision
      description: What exactly needs deciding, and why now.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
      description: Each option with what it costs and what it gives.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Filled in once decided. Record it in the [Decision log](https://github.com/KamaljeetSahoo/A-star-Algorithm/wiki/Decision-Log) too.
